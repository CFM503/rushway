[package]
name = "rushway"
version = "0.0.6"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Rust reimplementation of GoWay, targeting protocol-compatible forwarding."
repository = "https://github.com/CFM503/rushway"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "=4.5.20", features = ["derive"] }
jobserver = "=0.1.32"
quinn = { version = "=0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring", "bloom"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
socket2 = "0.5"
time = "=0.3.44"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webpki-roots = "0.26"
zeroize = "=1.7.0"

[dev-dependencies]
tempfile = "=3.13.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
