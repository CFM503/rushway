[package]
name = "rushway"
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Rust reimplementation of GoWay, targeting protocol-compatible forwarding."
repository = "https://github.com/CFM503/rushway"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
