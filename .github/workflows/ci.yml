name: RushWay CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rushway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      - name: Rust format check
        run: cargo fmt --all -- --check
        continue-on-error: true
      - name: Rust check
        run: cargo check --all-targets --all-features
      # Not enforcing -D warnings yet; flip to -D warnings once green.
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Release build
        run: cargo build --release
      - name: Upload Linux x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: rushway-linux-x64
          path: target/release/rushway
          if-no-files-found: error

  # Mirrors the release artifact target so a musl build break is caught on
  # every PR instead of at release time, and proves the binary runs without
  # any glibc dependency.
  musl-static:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build static x86_64 musl binary with cross-rs
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: x86_64-unknown-linux-musl
          args: --release
          toolchain: 1.88.0
      - name: Verify static linkage and smoke test
        run: |
          TARGET=target/x86_64-unknown-linux-musl/release/rushway
          file "$TARGET"
          if strings "$TARGET" | grep -q 'GLIBC_2\.'; then
            echo "::error::musl binary still references GLIBC_2 symbols"
            exit 1
          fi
          chmod +x "$TARGET"
          "$TARGET" -V

  windows-x64:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-gnu
      - name: Build Windows x64
        run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Upload Windows x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: rushway-windows-x64
          path: target/x86_64-pc-windows-gnu/release/rushway.exe
          if-no-files-found: error

  debian-12-x64:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build release binary inside Debian 12
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            rust:1.88-bookworm \
            bash -c 'apt-get update && apt-get install -y --no-install-recommends build-essential cmake pkg-config ca-certificates && export PATH="/usr/local/cargo/bin:/usr/local/rustup/bin:$PATH" && cargo build --release && file target/release/rushway'
      - name: Upload Debian 12 x64 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rushway-debian12-x64
          path: target/release/rushway
          if-no-files-found: error

  armv7-linux:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Matches the release artifact (release.yml builds musleabihf); the
      # previous gnueabihf target meant CI never compiled the shipped target.
      - name: Build ARMv7 musl Linux
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: armv7-unknown-linux-musleabihf
          args: --release
          toolchain: 1.88.0
      - name: Upload ARMv7 Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rushway-armv7-linux
          path: target/armv7-unknown-linux-musleabihf/release/rushway
          if-no-files-found: error
