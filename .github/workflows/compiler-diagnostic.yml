name: RushWay Compiler Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    if: "!startsWith(github.event.head_commit.message, 'fix: compiler sweep')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Run compiler diagnostic
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > fmt.log 2>&1
          cargo check --all-targets --all-features > check.log 2>&1
          echo $? > exit_code.txt
      - name: Upload compiler diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: rushway-compiler-diagnostic
          path: |
            fmt.log
            check.log
            exit_code.txt
          if-no-files-found: error
