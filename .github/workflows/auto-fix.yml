name: RushWay One-Time Auto Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  auto-fix:
    if: "!startsWith(github.event.head_commit.message, 'style: auto-fix')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          components: rustfmt
      - name: Fix known parser error
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/mux_pool.rs')
          s = p.read_text()
          old = 'if let Some(peer)=*latest.lock().await{let _=udp.send_to(payload,peer)}}upload.abort();'
          new = 'if let Some(peer)=*latest.lock().await{let _=udp.send_to(payload,peer).await?;}}upload.abort();'
          if old not in s:
              raise SystemExit('expected mux_pool parser-error pattern was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format all Rust sources
        run: cargo fmt --all
      - name: Remove temporary files
        run: rm -f CI_TRIGGER.md .github/workflows/auto-fix.yml
      - name: Commit repaired tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: auto-fix Rust formatting and parser error"
          git push origin HEAD:main
