name: MUX contention diagnostic

on:
  push:
    branches: [astra/mux-contention-diagnostic]
  pull_request:
    branches: [main]
    paths:
      - 'src/mux_pool.rs'
      - 'src/runtime.rs'
      - 'src/wss_client.rs'
      - 'src/bin/e2e_bench.rs'
      - '.github/workflows/mux-contention-diagnostic.yml'

permissions:
  contents: write

jobs:
  mux-contention-diagnostic:
    if: "${{ !contains(github.event.head_commit.message, 'apply MUX 1000 contention fixes') || github.event_name == 'pull_request' }}"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply production MUX contention fixes once
        id: apply_fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(s.replace(old, new))

          replace_once('src/wss_client.rs', 'let (tx, rx) = mpsc::channel(64);', 'let (tx, rx) = mpsc::channel(128);')
          replace_once(
              'src/wss_client.rs',
              '''        let mut ordered = snapshot;
        ordered.sort_by_key(|s| s.active.load(Ordering::Acquire));
        for session in ordered {''',
              '''        let mut ordered = snapshot
            .into_iter()
            .map(|session| (session.active.load(Ordering::Acquire), session))
            .collect::<Vec<_>>();
        ordered.sort_unstable_by_key(|(active, _)| *active);
        for (_active, session) in ordered {''',
          )
          replace_once(
              'src/wss_client.rs',
              '''struct WssSessionPool {
    cfg: WssConfig,
    sessions: Mutex<Vec<Arc<WssSessionState>>>,
}''',
              '''struct WssSessionPool {
    cfg: WssConfig,
    sessions: Mutex<Vec<Arc<WssSessionState>>>,
    session_creation: Mutex<()>,
}''',
          )
          replace_once(
              'src/wss_client.rs',
              '''        Arc::new(Self {
            cfg,
            sessions: Mutex::new(Vec::new()),
        })''',
              '''        Arc::new(Self {
            cfg,
            sessions: Mutex::new(Vec::new()),
            session_creation: Mutex::new(()),
        })''',
          )
          replace_once(
              'src/wss_client.rs',
              '''    async fn prewarm(self: &Arc<Self>) {
        for _ in 0..configured_session_count() {
            match WssSessionState::connect(&self.cfg).await {
                Ok(s) => self.sessions.lock().await.push(s),
                Err(error) => {
                    tracing::debug!(%error,"WSS physical session prewarm failed");
                    break;
                }
            }
        }
    }''',
              '''    async fn prewarm(self: &Arc<Self>) {
        let limit = configured_session_count();
        for _ in 0..limit {
            let _creation_guard = self.session_creation.lock().await;
            if self.sessions.lock().await.len() >= limit {
                break;
            }
            match WssSessionState::connect(&self.cfg).await {
                Ok(s) => self.sessions.lock().await.push(s),
                Err(error) => {
                    tracing::debug!(%error,"WSS physical session prewarm failed");
                    break;
                }
            }
        }
    }''',
          )
          replace_once(
              'src/wss_client.rs',
              '''        let limit = configured_session_count();
        let can_create = {
            let sessions = self.sessions.lock().await;
            sessions.len() < limit
        };
        if can_create {
            let session = WssSessionState::connect(&self.cfg).await?;
            let opened = session.open_stream(target).await?;
            self.sessions.lock().await.push(session.clone());
            return Ok((session, opened.0, opened.1));
        }''',
              '''        let limit = configured_session_count();
        let _creation_guard = self.session_creation.lock().await;
        let can_create = {
            let sessions = self.sessions.lock().await;
            sessions.len() < limit
        };
        if can_create {
            let session = WssSessionState::connect(&self.cfg).await?;
            let opened = session.open_stream(target).await?;
            self.sessions.lock().await.push(session.clone());
            return Ok((session, opened.0, opened.1));
        }''',
          )
          replace_once(
              'src/wss_client.rs',
              '''    let pool = WssSessionPool::new(wc.clone());
    pool.prewarm().await;
    let listener = TcpListener::bind(format!("{}:{}", wc.proxy_host, wc.proxy_port)).await?;''',
              '''    let pool = WssSessionPool::new(wc.clone());
    let listener = TcpListener::bind(format!("{}:{}", wc.proxy_host, wc.proxy_port)).await?;
    let prewarm_pool = pool.clone();
    tokio::spawn(async move {
        prewarm_pool.prewarm().await;
    });''',
          )
          replace_once('src/mux_pool.rs', 'let (tx, rx) = mpsc::channel(32);', 'let (tx, rx) = mpsc::channel(128);')
          replace_once('src/runtime.rs', 'let (tx, mut rx) = mpsc::channel(64);', 'let (tx, mut rx) = mpsc::channel(128);')
          PY

          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mux_pool.rs src/runtime.rs src/wss_client.rs
          git commit -m "fix: apply MUX 1000 contention fixes"
          git push origin HEAD:${GITHUB_HEAD_REF:-astra/mux-contention-diagnostic}
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Stop bootstrap run after source commit
        if: steps.apply_fix.outputs.changed == 'true'
        run: exit 0
      - uses: dtolnay/rust-toolchain@stable
        if: steps.apply_fix.outputs.changed != 'true'
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Instrument MUX dispatch and writer contention
        if: steps.apply_fix.outputs.changed != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/mux_pool.rs')
          s = p.read_text()
          old = '''        if let Some(tx) = tx {\n            if tx.send(frame).await.is_err() {\n                if state.streams.lock().await.remove(&id).is_some() {\n                    state.active.fetch_sub(1, Ordering::AcqRel);\n                }\n            }\n        }'''
          new = '''        if let Some(tx) = tx {\n            let started = std::time::Instant::now();\n            let send_result = tx.send(frame).await;\n            let elapsed = started.elapsed();\n            if elapsed >= Duration::from_millis(10) {\n                tracing::debug!(stream_id=id, elapsed_ms=elapsed.as_millis(), active=state.active.load(Ordering::Acquire), "MUX client stream dispatch blocked");\n            }\n            if send_result.is_err() {\n                if state.streams.lock().await.remove(&id).is_some() {\n                    state.active.fetch_sub(1, Ordering::AcqRel);\n                }\n            }\n        }'''
          if old not in s:
              raise SystemExit('client dispatch pattern not found')
          s = s.replace(old, new, 1)
          old = '''    cipher.apply(scratch);\n    let mut w = writer.lock().await;\n    write_frame(&mut *w, scratch, 2, true).await'''
          new = '''    cipher.apply(scratch);\n    let lock_started = std::time::Instant::now();\n    let mut w = writer.lock().await;\n    let lock_elapsed = lock_started.elapsed();\n    if lock_elapsed >= Duration::from_millis(10) {\n        tracing::debug!(stream_id, elapsed_ms=lock_elapsed.as_millis(), "MUX client writer lock blocked");\n    }\n    write_frame(&mut *w, scratch, 2, true).await'''
          if old not in s:
              raise SystemExit('client writer pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/runtime.rs')
          s = p.read_text()
          old = '''                if let Some(tx) = streams.lock().await.get(&id).map(|s| s.tx.clone()) {\n                    if tx.send(StreamCommand::Data(frame)).await.is_err() {\n                        streams.lock().await.remove(&id);\n                    }\n                }'''
          new = '''                if let Some(tx) = streams.lock().await.get(&id).map(|s| s.tx.clone()) {\n                    let started = std::time::Instant::now();\n                    let send_result = tx.send(StreamCommand::Data(frame)).await;\n                    let elapsed = started.elapsed();\n                    if elapsed >= tokio::time::Duration::from_millis(10) {\n                        tracing::debug!(stream_id=id, elapsed_ms=elapsed.as_millis(), "MUX server stream dispatch blocked");\n                    }\n                    if send_result.is_err() {\n                        streams.lock().await.remove(&id);\n                    }\n                }'''
          if old not in s:
              raise SystemExit('server dispatch pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Build diagnostic binaries
        if: steps.apply_fix.outputs.changed != 'true'
        run: cargo build --release --bin rushway --bin e2e_bench
      - name: Run WS 1000 diagnostic
        if: steps.apply_fix.outputs.changed != 'true'
        shell: bash
        env:
          RUSHWAY_E2E_TRANSPORT: ws
          RUSHWAY_E2E_STRESS: '1'
          RUSHWAY_E2E_STRESS_PATTERN: staged
          RUSHWAY_E2E_INCLUDE_1000: '1'
          RUSHWAY_E2E_MUX_SESSIONS: '64'
          RUSHWAY_E2E_DIAGNOSTIC: '1'
        run: |
          ulimit -n 8192
          cargo run --release --bin e2e_bench 2>&1 | tee mux-ws-diagnostic.log
        continue-on-error: true
      - name: Run WSS 1000 diagnostic
        if: steps.apply_fix.outputs.changed != 'true'
        shell: bash
        env:
          RUSHWAY_E2E_TRANSPORT: wss
          RUSHWAY_E2E_STRESS: '1'
          RUSHWAY_E2E_STRESS_PATTERN: staged
          RUSHWAY_E2E_INCLUDE_1000: '1'
          RUSHWAY_E2E_MUX_SESSIONS: '64'
          RUSHWAY_E2E_DIAGNOSTIC: '1'
        run: |
          ulimit -n 8192
          cargo run --release --bin e2e_bench 2>&1 | tee mux-wss-diagnostic.log
        continue-on-error: true
      - name: Upload diagnostic logs
        if: steps.apply_fix.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mux-contention-diagnostics
          path: 'mux-*-diagnostic.log'
          if-no-files-found: ignore
