name: RushWay Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
      - run: cargo build --release
      - name: Package
        run: tar -C target/release -czf rushway-linux-x64.tar.gz rushway
      - uses: actions/upload-artifact@v4
        with:
          name: rushway-linux-x64-release
          path: rushway-linux-x64.tar.gz
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rushway-linux-x64.tar.gz

  windows-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          targets: x86_64-pc-windows-gnu
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Package
        run: zip -j rushway-windows-x64.zip target/x86_64-pc-windows-gnu/release/rushway.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rushway-windows-x64-release
          path: rushway-windows-x64.zip
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rushway-windows-x64.zip

  armv7-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          targets: armv7-unknown-linux-gnueabihf
      - name: Build
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: cargo build --release --target armv7-unknown-linux-gnueabihf
      - name: Package
        run: tar -C target/armv7-unknown-linux-gnueabihf/release -czf rushway-armv7-linux.tar.gz rushway
      - uses: actions/upload-artifact@v4
        with:
          name: rushway-armv7-linux-release
          path: rushway-armv7-linux.tar.gz
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rushway-armv7-linux.tar.gz
