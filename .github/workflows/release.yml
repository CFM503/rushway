name: RushWay Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag to build and publish (leave empty for current version)'
        required: false
        default: ''
      draft:
        description: 'Publish as draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Publish as prerelease'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
      - name: Install MinGW toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-gnu
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Package
        run: zip -j rushway-windows-x64.zip target/x86_64-pc-windows-gnu/release/rushway.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rushway-windows-x64
          path: rushway-windows-x64.zip
          if-no-files-found: error

  debian12-x64:
    name: Build Debian 12 x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
      - name: Build inside Debian 12 (Bookworm)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            rust:1.88-bookworm \
            bash -c 'apt-get update && apt-get install -y --no-install-recommends build-essential cmake pkg-config ca-certificates && export PATH="/usr/local/cargo/bin:/usr/local/rustup/bin:$PATH" && cargo build --release && file target/release/rushway && tar -C target/release -czf /src/rushway-debian12-x64.tar.gz rushway'
      - uses: actions/upload-artifact@v4
        with:
          name: rushway-debian12-x64
          path: rushway-debian12-x64.tar.gz
          if-no-files-found: error

  kwrt-armv7:
    name: Build KWRT ARMv7 (musl)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
      - name: Build ARMv7 musl binary with cross-rs
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: armv7-unknown-linux-musleabihf
          args: --release
          toolchain: 1.88.0
      - name: Package KWRT ARMv7
        run: tar -C target/armv7-unknown-linux-musleabihf/release -czf rushway-kwrt-armv7.tar.gz rushway
      - uses: actions/upload-artifact@v4
        with:
          name: rushway-kwrt-armv7
          path: rushway-kwrt-armv7.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs:
      - windows-x64
      - debian12-x64
      - kwrt-armv7
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release-assets/rushway-windows-x64.zip
            release-assets/rushway-debian12-x64.tar.gz
            release-assets/rushway-kwrt-armv7.tar.gz
            release-assets/SHA256SUMS.txt
