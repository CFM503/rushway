name: RushWay Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag to publish (leave empty to derive it from Cargo.toml)'
        required: false
        default: ''
      target_ref:
        description: 'Branch, tag or SHA to build (leave empty = the ref picked in the branch dropdown)'
        required: false
        default: ''
      publish:
        description: 'Publish a GitHub Release (uncheck for a build-only dry run)'
        type: boolean
        required: false
        default: true
      draft:
        description: 'Publish as draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Publish as prerelease'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Compilation gate. This workflow is also the only thing that compiles a
  # release, so a change that does not type-check has to block the publish
  # step rather than ship binaries built from a broken tree.
  check:
    name: Compile check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.event.inputs.tag_name || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: cargo check
        run: cargo check --all-targets --all-features

  windows-x64:
    name: Build Windows x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.event.inputs.tag_name || github.ref }}
      - name: Install MinGW toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-gnu
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Package
        run: zip -j rushway-windows-x64.zip target/x86_64-pc-windows-gnu/release/rushway.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rushway-windows-x64
          path: rushway-windows-x64.zip
          if-no-files-found: error

  # Static musl build: no glibc dependency, so the same binary runs on
  # Debian 10+, Ubuntu 18.04+, Alpine and scratch images. The previous
  # Debian 12 (bookworm) build required GLIBC_2.34 and failed on any host
  # older than Debian 11 / Ubuntu 20.04.
  linux-x64-musl:
    name: Build Linux x64 (static musl)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.event.inputs.tag_name || github.ref }}
      - name: Build static x86_64 musl binary with cross-rs
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: x86_64-unknown-linux-musl
          args: --release
          toolchain: 1.88.0
      - name: Verify the binary is static
        run: |
          TARGET=target/x86_64-unknown-linux-musl/release/rushway
          file "$TARGET"
          if ldd "$TARGET" 2>&1 | grep -qi 'not a dynamic executable\|statically linked'; then
            echo "static: yes"
          else
            echo "::error::musl binary is still dynamically linked"; ldd "$TARGET" || true
            exit 1
          fi
          if strings "$TARGET" | grep -q 'GLIBC_2\.'; then
            echo "::error::musl binary still references GLIBC_2 symbols"
            exit 1
          fi
          echo "glibc symbols: none"
      - name: Smoke test the static binary
        run: |
          chmod +x target/x86_64-unknown-linux-musl/release/rushway
          target/x86_64-unknown-linux-musl/release/rushway -V
      - name: Package Linux x64 musl
        run: tar -C target/x86_64-unknown-linux-musl/release -czf rushway-linux-x64-musl.tar.gz rushway
      - uses: actions/upload-artifact@v4
        with:
          name: rushway-linux-x64-musl
          path: rushway-linux-x64-musl.tar.gz
          if-no-files-found: error

  kwrt-armv7:
    name: Build KWRT ARMv7 (musl)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.event.inputs.tag_name || github.ref }}
      - name: Build ARMv7 musl binary with cross-rs
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: armv7-unknown-linux-musleabihf
          args: --release
          toolchain: 1.88.0
      - name: Package KWRT ARMv7
        run: tar -C target/armv7-unknown-linux-musleabihf/release -czf rushway-kwrt-armv7.tar.gz rushway
      - uses: actions/upload-artifact@v4
        with:
          name: rushway-kwrt-armv7
          path: rushway-kwrt-armv7.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    # The `publish != 'false'` half only bites on a manual run with the box
    # unticked: on a tag push there are no inputs, so it reads empty and the
    # release still fires.
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event.inputs.publish != 'false'
    needs:
      - check
      - windows-x64
      - linux-x64-musl
      - kwrt-armv7
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.event.inputs.tag_name || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          # Without this, a manual run against a non-tag ref creates the tag
          # on the default branch instead of on the ref that was actually
          # built.
          target_commitish: ${{ github.event.inputs.target_ref || github.sha }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release-assets/rushway-windows-x64.zip
            release-assets/rushway-linux-x64-musl.tar.gz
            release-assets/rushway-kwrt-armv7.tar.gz
            release-assets/SHA256SUMS.txt
