name: RushWay Actions Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: rushway-actions-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-22.04
    steps:
      - name: Runner check
        run: |
          echo "Actions runner is alive"
          uname -a
      - uses: actions/checkout@v4
      - name: Rust check
        run: rustc --version
