name: apply go-style mux manager

on:
  push:
    branches:
      - astra/go-style-mux-session-manager
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra/go-style-mux-session-manager
          fetch-depth: 0
      - name: Apply session-manager refactor
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/mux_pool.rs")
          s = p.read_text()

          old = '''    async fn prewarm(self: &Arc<Self>) {
        for _ in 0..configured_session_count() {
            match SessionState::connect(&self.cfg).await {
                Ok(s) => self.sessions.lock().await.push(s),
                Err(e) => {
                    tracing::debug!(error=%e,"MUX session prewarm failed");
                    break;
                }
            }
        }
    }
'''
          new = '''    async fn replenish(self: &Arc<Self>) {
        let target = configured_session_count();
        let _guard = self.session_creation.lock().await;
        let need_new = {
            let mut sessions = self.sessions.lock().await;
            sessions.retain(|s| !s.closed.load(Ordering::Acquire));
            sessions.len() < target
        };
        if !need_new {
            return;
        }
        match SessionState::connect(&self.cfg).await {
            Ok(s) => self.sessions.lock().await.push(s),
            Err(error) => {
                tracing::debug!(error=%error,"MUX physical session creation failed; will retry")
            }
        }
    }
    async fn maintain(self: &Arc<Self>) {
        loop {
            self.replenish().await;
            tokio::time::sleep(Duration::from_millis(100)).await;
        }
    }
'''
          if old not in s:
              raise SystemExit("prewarm block not found")
          s = s.replace(old, new, 1)

          old = '''            if let Some(s) = sessions
                .iter()
                .filter(|s| s.available())
                .min_by_key(|s| s.active.load(Ordering::Acquire))
                .cloned()
            {
'''
          new = '''            let snapshot = sessions
                .iter()
                .filter(|s| s.available())
                .map(|s| (s.active.load(Ordering::Acquire), s.clone()))
                .collect::<Vec<_>>();
            if let Some((_active, s)) = snapshot.into_iter().min_by_key(|(active, _)| *active) {
'''
          if old not in s:
              raise SystemExit("session selection block not found")
          s = s.replace(old, new, 1)

          old = '''pub async fn run_client(cfg: RuntimeConfig) -> Result<()> {
    let pool = MuxSessionPool::new(cfg.clone());
    pool.prewarm().await;
    let listener = TcpListener::bind(format!("{}:{}", cfg.proxy_host, cfg.proxy_port)).await?;
    let semaphore = Arc::new(Semaphore::new(cfg.max_connections.max(1)));
'''
          new = '''pub async fn run_client(cfg: RuntimeConfig) -> Result<()> {
    let pool = MuxSessionPool::new(cfg.clone());
    let listener = TcpListener::bind(format!("{}:{}", cfg.proxy_host, cfg.proxy_port)).await?;
    let pool_maintainer = pool.clone();
    tokio::spawn(async move {
        pool_maintainer.maintain().await;
    });
    let semaphore = Arc::new(Semaphore::new(cfg.max_connections.max(1)));
'''
          if old not in s:
              raise SystemExit("run_client startup block not found")
          s = s.replace(old, new, 1)

          p.write_text(s)

          handoff = Path("AI_HANDOFF.md")
          with handoff.open("a") as f:
              f.write_text("""\n\n## 2026-09-15 — Astra Go-style Session Manager alignment\n\n### Bug / architectural defect\n- Plain-WS pooled MUX client still synchronously prewarmed all configured physical sessions before binding the local proxy listener.\n- This left local readiness coupled to upstream DNS/TCP/WebSocket/MUX handshakes and made startup behavior differ from the newly corrected WSS pool.\n\n### Root cause / evidence\n- `src/mux_pool.rs::run_client()` called `pool.prewarm().await` before `TcpListener::bind(...)`.\n- The pool also used a polling selection path over live `AtomicUsize` values.\n- Mature Go multiplexers such as HashiCorp yamux model the physical connection as a Session and logical connections as Streams, with explicit backpressure and lifecycle management; smux likewise separates Session and Stream responsibilities and provides session-wide receive budgeting. citeturn393437search0turn393437search3\n\n### Astra review\n- Concurrency: session creation is serialized with the existing `session_creation` mutex; session selection snapshots active counts before ordering.\n- Lifecycle: the local proxy listener now binds before background session replenishment starts, so readiness no longer depends on full upstream prewarm.\n- Resource ownership: closed physical sessions are pruned during replenishment and acquisition.\n- Protocol: no MUX wire format, command semantics, target policy, or stream limit changed.\n- Performance: one session is added per 100 ms maintenance cycle instead of blocking startup on all sessions.\n- Regression risk: initial requests can still create a session lazily when the pool has no usable capacity; this remains intentionally preserved.\n\n### Change\n- `src/mux_pool.rs` only.\n- Replace blocking `prewarm()` with `replenish()` + background `maintain()`.\n- Bind the client listener before starting maintenance.\n- Snapshot active counts before choosing the least-loaded session.\n\n### Commit\n- Branch: `astra/go-style-mux-session-manager`\n- Commit SHA: to be recorded after the source/documentation commit lands.\n\n### Validation\n- Pending CI on the new branch revision.\n- Required acceptance for this cycle: Rust fmt/check/test/release, standalone WS/WSS/QUIC regressions, and the existing 1000-stream diagnostics once; do not treat any diagnostic `continue-on-error` job conclusion alone as proof.\n\n### Status\n- **Implemented; awaiting executable validation.**\n\n### Remaining risk\n- The physical MUX reader still uses bounded per-stream channels, so dispatcher backpressure/HOL behavior remains a separate follow-up area.\n- GoWay interoperability remains unverified unless the cloud comparison job actually runs with `WAY_READ_TOKEN`.\n\n### Next action\n- Run the consolidated CI acceptance cycle on this branch, then either merge the branch as the next native Session Manager step or make one consolidated correction from the observed evidence.\n""")

          progress = Path("PROGRESS.md")
          text = progress.read_text()
          marker = "## 2026-09-15 — Go-style MUX Session Manager refactor in progress\n"
          if marker not in text:
              text = marker + "\n- Branch: `astra/go-style-mux-session-manager`, based on PR #18 WSS startup fix.\n- Plain-WS pooled MUX now binds the local proxy first, then replenishes physical sessions in a background maintainer.\n- Session creation remains serialized; active-count ordering uses a stable snapshot.\n- No protocol wire-format change.\n- Executable validation is pending; release gate remains blocked.\n\n" + text
              progress.write_text(text)

      - name: Format
        run: cargo fmt --all
      - name: Commit source and handoff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mux_pool.rs AI_HANDOFF.md PROGRESS.md
          git commit -m "refactor: align MUX session manager with Go-style lifecycle"
          git push origin HEAD:astra/go-style-mux-session-manager
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-go-style-mux-manager.yml
          git commit -m "chore: remove temporary refactor workflow"
          git push origin HEAD:astra/go-style-mux-session-manager
