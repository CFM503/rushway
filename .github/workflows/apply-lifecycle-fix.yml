name: one-shot stream lifecycle fix

on:
  push:
    branches:
      - astra/stream-lifecycle-cancellation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply lifecycle ownership and cancellation patch
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/runtime.rs")
          s = p.read_text()
          if "watch::{self, Receiver, Sender}" not in s:
              s = s.replace("use tokio::sync::{mpsc, Mutex, Semaphore};", "use tokio::sync::{mpsc, watch, Mutex, Semaphore};")
          s = s.replace(
              "struct StreamEntry {\n    tx: mpsc::Sender<StreamCommand>,\n}",
              "struct StreamEntry {\n    tx: mpsc::Sender<StreamCommand>,\n    cancel: watch::Sender<bool>,\n}",
          )
          s = s.replace(
              "let (tx, mut rx) = mpsc::channel(64);",
              "let (tx, mut rx) = mpsc::channel(64);\n                let (cancel, mut cancelled) = watch::channel(false);",
          )
          s = s.replace(
              "guard.insert(stream_id, StreamEntry { tx: tx.clone() });",
              "guard.insert(stream_id, StreamEntry { tx: tx.clone(), cancel: cancel.clone() });",
          )
          old = """                            command = rx.recv() => {\n                                match command {\n                                    Some(StreamCommand::Data(frame)) => {\n                                        pending.push(frame);\n                                    }\n                                    Some(StreamCommand::Fin)\n                                    | Some(StreamCommand::Reset)\n                                    | None => {\n                                        streams_task.lock().await.remove(&stream_id);\n                                        return;\n                                    }\n                                }\n                            }\n"""
          new = """                            command = rx.recv() => {\n                                match command {\n                                    Some(StreamCommand::Data(frame)) => {\n                                        pending.push(frame);\n                                    }\n                                    Some(StreamCommand::Fin)\n                                    | Some(StreamCommand::Reset)\n                                    | None => {\n                                        streams_task.lock().await.remove(&stream_id);\n                                        return;\n                                    }\n                                }\n                            }\n\n                            changed = cancelled.changed() => {\n                                match changed {\n                                    Ok(()) if *cancelled.borrow() => {\n                                        streams_task.lock().await.remove(&stream_id);\n                                        return;\n                                    }\n                                    Ok(()) => {}\n                                    Err(_) => {\n                                        streams_task.lock().await.remove(&stream_id);\n                                        return;\n                                    }\n                                }\n                            }\n"""
          if old not in s:
              raise SystemExit("dialing command block not found")
          s = s.replace(old, new, 1)
          old = """            MuxCommand::Data => {\n                let id = frame.stream_id;\n\n                if let Some(tx) = streams.lock().await.get(&id).map(|s| s.tx.clone()) {\n                    if tx.send(StreamCommand::Data(frame)).await.is_err() {\n                        streams.lock().await.remove(&id);\n                    }\n                }\n            }\n\n            MuxCommand::Fin => {\n                if let Some(tx) = streams\n                    .lock()\n                    .await\n                    .get(&frame.stream_id)\n                    .map(|s| s.tx.clone())\n                {\n                    let _ = tx.send(StreamCommand::Fin).await;\n                }\n            }\n\n            MuxCommand::Rst => {\n                let tx = streams.lock().await.remove(&frame.stream_id).map(|s| s.tx);\n\n                if let Some(tx) = tx {\n                    let _ = tx.send(StreamCommand::Reset).await;\n                }\n            }\n"""
          new = """            MuxCommand::Data => {\n                let id = frame.stream_id;\n\n                if let Some(tx) = streams.lock().await.get(&id).map(|s| s.tx.clone()) {\n                    let _ = tx.send(StreamCommand::Data(frame)).await;\n                }\n            }\n\n            MuxCommand::Fin => {\n                if let Some(entry) = streams.lock().await.get(&frame.stream_id) {\n                    let _ = entry.tx.send(StreamCommand::Fin).await;\n                    // FIN during DIALING must invalidate the pending dial, while\n                    // established streams keep normal half-close semantics.\n                    let _ = entry.cancel.send(true);\n                }\n            }\n\n            MuxCommand::Rst => {\n                if let Some(entry) = streams.lock().await.get(&frame.stream_id) {\n                    // The stream task remains the sole cleanup owner. RST only\n                    // signals cancellation and never removes the table entry.\n                    let _ = entry.tx.send(StreamCommand::Reset).await;\n                    let _ = entry.cancel.send(true);\n                }\n            }\n"""
          if old not in s:
              raise SystemExit("dispatch block not found")
          s = s.replace(old, new, 1)
          marker = "\nasync fn resolve_udp_target(target: &TargetAddr) -> Result<SocketAddr> {"
          tests = r'''\n\n#[cfg(test)]\nmod stream_lifecycle_tests {\n    use super::*;\n    use tokio::time::{sleep, timeout};\n\n    #[tokio::test]\n    async fn dialing_cancel_signal_wakes_immediately() {\n        let (cancel, mut rx) = watch::channel(false);\n        let waiter = tokio::spawn(async move {\n            loop {\n                if *rx.borrow() {\n                    return true;\n                }\n                if rx.changed().await.is_err() {\n                    return false;\n                }\n            }\n        });\n\n        sleep(Duration::from_millis(5)).await;\n        cancel.send(true).unwrap();\n\n        let observed = timeout(Duration::from_millis(100), waiter)\n            .await\n            .expect("DIALING cancellation did not wake")\n            .expect("cancellation waiter panicked");\n        assert!(observed);\n    }\n\n    #[tokio::test]\n    async fn cancellation_precedes_slow_dial() {\n        let (cancel, mut rx) = watch::channel(false);\n        let task = tokio::spawn(async move {\n            tokio::select! {\n                _ = sleep(Duration::from_secs(5)) => false,\n                changed = rx.changed() => changed.is_ok() && *rx.borrow(),\n            }\n        });\n\n        cancel.send(true).unwrap();\n        let result = timeout(Duration::from_millis(100), task)\n            .await\n            .expect("slow dial was not cancelled promptly")\n            .expect("cancellation task panicked");\n        assert!(result);\n    }\n}\n'''
          if "dialing_cancel_signal_wakes_immediately" not in s:
              s = s.replace(marker, tests + marker)
          p.write_text(s)
      - name: Format
        run: cargo fmt -- --check
      - name: Test
        run: cargo test
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes produced"
            exit 0
          fi
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime.rs
          git commit -m "fix: make MUX stream lifecycle cancellation explicit"
          git push origin HEAD:astra/stream-lifecycle-cancellation
      - name: Remove one-shot runner
        shell: bash
        run: |
          git rm -f .github/workflows/apply-lifecycle-fix.yml
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-shot lifecycle fix runner"
          git push origin HEAD:astra/stream-lifecycle-cancellation
