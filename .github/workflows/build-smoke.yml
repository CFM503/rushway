name: RushWay Build Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          targets: x86_64-pc-windows-gnu
      - name: Install Windows linker
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Cargo test
        run: cargo test --all-targets
      - name: Build Linux x64
        run: cargo build --release
      - name: Build Windows x64
        run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/rushway dist/rushway-linux-x64
          cp target/x86_64-pc-windows-gnu/release/rushway.exe dist/rushway-windows-x64.exe
          file dist/rushway-linux-x64 dist/rushway-windows-x64.exe
      - name: Upload Linux x64
        uses: actions/upload-artifact@v4
        with:
          name: rushway-linux-x64-smoke
          path: dist/rushway-linux-x64
          if-no-files-found: error
      - name: Upload Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: rushway-windows-x64-smoke
          path: dist/rushway-windows-x64.exe
          if-no-files-found: error
