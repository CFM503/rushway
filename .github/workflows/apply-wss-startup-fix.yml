name: Apply WSS startup fix

on:
  push:
    branches: [fix/wss-startup-readiness]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/wss-startup-readiness'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wss-startup-readiness
          fetch-depth: 0
      - name: Patch WSS client pool startup
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/wss_client.rs')
          s = p.read_text()
          old_pool = '''struct WssSessionPool {\n    cfg: WssConfig,\n    sessions: Mutex<Vec<Arc<WssSessionState>>>,\n}\nimpl WssSessionPool {\n    fn new(cfg: WssConfig) -> Arc<Self> {\n        Arc::new(Self {\n            cfg,\n            sessions: Mutex::new(Vec::new()),\n        })\n    }\n    async fn prewarm(self: &Arc<Self>) {\n        for _ in 0..configured_session_count() {\n            match WssSessionState::connect(&self.cfg).await {\n                Ok(s) => self.sessions.lock().await.push(s),\n                Err(error) => {\n                    tracing::debug!(%error,\"WSS physical session prewarm failed\");\n                    break;\n                }\n            }\n        }\n    }\n'''
          new_pool = '''struct WssSessionPool {\n    cfg: WssConfig,\n    sessions: Mutex<Vec<Arc<WssSessionState>>>,\n    session_creation: Mutex<()>,\n}\nimpl WssSessionPool {\n    fn new(cfg: WssConfig) -> Arc<Self> {\n        Arc::new(Self {\n            cfg,\n            sessions: Mutex::new(Vec::new()),\n            session_creation: Mutex::new(()),\n        })\n    }\n    async fn replenish(self: &Arc<Self>) {\n        let target = configured_session_count();\n        let _guard = self.session_creation.lock().await;\n        let need_new = {\n            let mut sessions = self.sessions.lock().await;\n            sessions.retain(|s| !s.closed.load(Ordering::Acquire));\n            sessions.len() < target\n        };\n        if !need_new {\n            return;\n        }\n        match WssSessionState::connect(&self.cfg).await {\n            Ok(s) => self.sessions.lock().await.push(s),\n            Err(error) => tracing::debug!(%error,\"WSS physical session creation failed; will retry\"),\n        }\n    }\n    async fn maintain(self: &Arc<Self>) {\n        loop {\n            self.replenish().await;\n            tokio::time::sleep(Duration::from_millis(100)).await;\n        }\n    }\n'''
          if old_pool not in s:
              raise SystemExit('WssSessionPool block not found')
          s = s.replace(old_pool, new_pool, 1)
          old_sort = '''        let mut ordered = snapshot;\n        ordered.sort_by_key(|s| s.active.load(Ordering::Acquire));\n        for session in ordered {\n'''
          new_sort = '''        let mut ordered = snapshot\n            .into_iter()\n            .map(|session| (session.active.load(Ordering::Acquire), session))\n            .collect::<Vec<_>>();\n        ordered.sort_unstable_by_key(|(active, _)| *active);\n        for (_active, session) in ordered {\n'''
          if old_sort not in s:
              raise SystemExit('WSS sort block not found')
          s = s.replace(old_sort, new_sort, 1)
          old_create = '''        let limit = configured_session_count();\n        let can_create = {\n            let sessions = self.sessions.lock().await;\n            sessions.len() < limit\n        };\n        if can_create {\n            let session = WssSessionState::connect(&self.cfg).await?;\n            let opened = session.open_stream(target).await?;\n            self.sessions.lock().await.push(session.clone());\n            return Ok((session, opened.0, opened.1));\n        }\n'''
          new_create = '''        let limit = configured_session_count();\n        let _guard = self.session_creation.lock().await;\n        let can_create = {\n            let mut sessions = self.sessions.lock().await;\n            sessions.retain(|s| !s.closed.load(Ordering::Acquire));\n            sessions.len() < limit\n        };\n        if can_create {\n            let session = WssSessionState::connect(&self.cfg).await?;\n            let opened = session.open_stream(target).await?;\n            self.sessions.lock().await.push(session.clone());\n            return Ok((session, opened.0, opened.1));\n        }\n'''
          if old_create not in s:
              raise SystemExit('WSS create block not found')
          s = s.replace(old_create, new_create, 1)
          old_run = '''    let pool = WssSessionPool::new(wc.clone());\n    pool.prewarm().await;\n    let listener = TcpListener::bind(format!(\"{}:{}\", wc.proxy_host, wc.proxy_port)).await?;\n'''
          new_run = '''    let pool = WssSessionPool::new(wc.clone());\n    let listener = TcpListener::bind(format!(\"{}:{}\", wc.proxy_host, wc.proxy_port)).await?;\n    let pool_maintainer = pool.clone();\n    tokio::spawn(async move {\n        pool_maintainer.maintain().await;\n    });\n'''
          if old_run not in s:
              raise SystemExit('WSS run_client startup block not found')
          s = s.replace(old_run, new_run, 1)
          p.write_text(s)
      - name: Commit patched source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wss_client.rs .github/workflows/apply-wss-startup-fix.yml
          git diff --cached --quiet || git commit -m "fix: make WSS session pool startup non-blocking"
          git push origin HEAD:fix/wss-startup-readiness

# ensure a second push can retrigger this workflow after it is first installed
