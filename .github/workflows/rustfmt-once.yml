name: RushWay One-Time Rustfmt

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'style: rustfmt')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          components: rustfmt
      - name: Format all Rust sources
        run: cargo fmt --all
      - name: Commit formatted tree and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rustfmt-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: rustfmt"
          git push origin HEAD:main
