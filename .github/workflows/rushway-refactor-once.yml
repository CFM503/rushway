name: RushWay native refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message != 'Apply RushWay native runtime refactor'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply RushWay concurrency refactor
        run: |
          python3 <<'PY'
          from pathlib import Path

          mux = Path('src/mux_pool.rs')
          s = mux.read_text()
          old = '            if !need_new {\n                bail!("all pooled MUX sessions are at stream capacity")\n            };'
          new = '''            if !need_new {
                // RushWay uses backpressure instead of dropping a local connection
                // when all physical MUX sessions are temporarily full.
                tokio::time::sleep(Duration::from_millis(2)).await;
                continue;
            }'''
          if old not in s:
              raise SystemExit('mux capacity guard not found')
          s = s.replace(old, new, 1)
          old = '''let permit = match semaphore.clone().try_acquire_owned() {
            Ok(v) => v,
            Err(_) => {
                tracing::debug!(%peer,"maximum client connections reached");
                continue;
            }
        };'''
          new = 'let permit = semaphore.clone().acquire_owned().await?;'
          if old not in s:
              raise SystemExit('client semaphore block not found')
          s = s.replace(old, new, 1)
          mux.write_text(s)

          runtime = Path('src/runtime.rs')
          s = runtime.read_text()
          old = '''let permit = match semaphore.clone().try_acquire_owned() {
            Ok(v) => v,
            Err(_) => {
                tracing::debug!(%peer,"maximum concurrent connections reached");
                continue;
            }
        };'''
          new = 'let permit = semaphore.clone().acquire_owned().await?;'
          if old not in s:
              raise SystemExit('server semaphore block not found')
          s = s.replace(old, new, 1)
          old = '''                let stream_limit_reached = {
                    let guard = streams.lock().await;
                    guard.len() >= 256
                };

                if stream_limit_reached {
                    let _ = send_reset_encrypted(&writer, &cipher, stream_id).await;
                    continue;
                }

                let (tx, mut rx) = mpsc::channel(64);

                streams
                    .lock()
                    .await
                    .insert(stream_id, StreamEntry { tx: tx.clone() });'''
          new = '''                let (tx, mut rx) = mpsc::channel(64);

                // Atomically admit and register the logical stream. This removes
                // the check-then-insert race during large concurrent SYN bursts.
                let admitted = {
                    let mut guard = streams.lock().await;
                    if guard.len() >= 256 || guard.contains_key(&stream_id) {
                        false
                    } else {
                        guard.insert(stream_id, StreamEntry { tx: tx.clone() });
                        true
                    }
                };
                if !admitted {
                    let _ = send_reset_encrypted(&writer, &cipher, stream_id).await;
                    continue;
                }'''
          if old not in s:
              raise SystemExit('stream admission block not found')
          s = s.replace(old, new, 1)
          runtime.write_text(s)
          PY
      - name: Validate formatting and tests
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets --all-features
          cargo test --all-targets --all-features
      - name: Commit native refactor and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mux_pool.rs src/runtime.rs .github/workflows/rushway-refactor-once.yml
          git rm .github/workflows/rushway-refactor-once.yml
          git commit -m "Apply RushWay native runtime refactor"
          git push origin HEAD:main
