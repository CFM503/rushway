name: RushWay One-Time Source Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!startsWith(github.event.head_commit.message, 'fix: compiler sweep')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Apply mechanical compiler repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  if old not in s:
                      print(f'SKIP {path}: pattern not found: {old[:100]!r}')
                  else:
                      s = s.replace(old, new)
              p.write_text(s)

          patch('src/mux_pool.rs', [
              ('        tracing::debug!(%peer,error=%e,"pooled proxy connection closed")\n            }\n        })\n    }', '        tracing::debug!(%peer,error=%e,"pooled proxy connection closed")\n            }\n        });\n    }'),
          ])

          patch('src/nonmux.rs', [
              ('            if let Err(error) = handle_client_connection(stream, cfg2).await {\n                tracing::debug!(%peer,%error,"non-MUX client connection closed")\n            }\n        })\n    }', '            if let Err(error) = handle_client_connection(stream, cfg2).await {\n                tracing::debug!(%peer,%error,"non-MUX client connection closed")\n            }\n        });\n    }'),
              ('            if let Err(error) = handle_server(stream, cfg2).await {\n                tracing::debug!(%peer,%error,"non-MUX transport closed")\n            }\n        })\n    }', '            if let Err(error) = handle_server(stream, cfg2).await {\n                tracing::debug!(%peer,%error,"non-MUX transport closed")\n            }\n        });\n    }'),
          ])

          patch('src/quic.rs', [
              ('    cfg.stream_receive_window(VarInt::from_u64(8 * 1024 * 1024));', '    cfg.stream_receive_window(VarInt::from_u64(8 * 1024 * 1024).expect("QUIC stream window fits VarInt"));'),
              ('    cfg.receive_window(VarInt::from_u64(16 * 1024 * 1024));', '    cfg.receive_window(VarInt::from_u64(16 * 1024 * 1024).expect("QUIC connection window fits VarInt"));'),
              ('                                })\n                            }\n                            Err(_) => break,', '                                });\n                            }\n                            Err(_) => break,'),
              ('                Err(_) => return,\n            }\n        })\n    }', '                Err(_) => return,\n            }\n        });\n    }'),
              ('                        }\n                    }\n                })\n    }', '                        }\n                    }\n                });\n    }'),
              ('                        })\n                    }\n                }\n                Err(_) => break,', '                        });\n                    }\n                }\n                Err(_) => break,'),
          ])

          patch('src/runtime.rs', [
              ('let addr = resolve_socket(&target.host, target.port).await.map_err(anyhow::Error::from)?;', 'let addr = resolve_socket(&target.host, target.port).await.map_err(|e| std::io::Error::new(std::io::ErrorKind::Other, e.to_string()))?;'),
              ('                write_frame(&mut *w, &packet, 2, false).await?\n        }\n        Result::<()>::Ok(())', '                write_frame(&mut *w, &packet, 2, false).await?\n        }\n        Result::<()>::Ok(())'),
              ('            }\n        })\n    }\n}', '            }\n        });\n    }\n}'),
          ])

          patch('src/wss_client.rs', [
              ('            if let Err(e) = handle_non_mux_connection(stream, cfg2).await {\n                tracing::debug!(%peer,error=%e,"WSS non-MUX connection closed")\n            }\n        })\n    }', '            if let Err(e) = handle_non_mux_connection(stream, cfg2).await {\n                tracing::debug!(%peer,error=%e,"WSS non-MUX connection closed")\n            }\n        });\n    }'),
              ('            if let Err(e) = handle_connection(stream, pool2).await {\n                tracing::debug!(%peer,error=%e,"WSS proxy connection closed")\n            }\n        })\n    }', '            if let Err(e) = handle_connection(stream, pool2).await {\n                tracing::debug!(%peer,error=%e,"WSS proxy connection closed")\n            }\n        });\n    }'),
              ('#[derive(Debug)]\nstruct WssSessionPool {', 'struct WssSessionPool {'),
          ])

          patch('src/main.rs', [
              ('    let args = Args::parse_from(&raw_args);\n    let filter =', '''    let args = Args::parse_from(&raw_args);\n    if !(1..=64).contains(&args.mux_sessions) {\n        return Err(anyhow!("mux-sessions must be between 1 and 64"));\n    }\n    if let Some(v) = args.max_conn {\n        if !(1..=1_000_000).contains(&v) {\n            return Err(anyhow!("max-conn must be between 1 and 1000000"));\n        }\n    }\n    let filter =''')
          ])
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check compile
        run: cargo check --all-targets --all-features
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/source-repair-once.yml
          git add -A
          git commit -m "fix: compiler sweep" || exit 0
          git push origin HEAD:main
