name: RushWay One-Time Source Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!startsWith(github.event.head_commit.message, 'fix: compiler sweep')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Apply exact compiler repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, pairs):
              p=Path(path); s=p.read_text()
              for old,new in pairs:
                  n=s.count(old); print(path,n,repr(old[:90]))
                  if n: s=s.replace(old,new)
              p.write_text(s)
          replace('src/mux_pool.rs',[
            ('#[derive(Debug)]\nstruct MuxSessionState {','struct MuxSessionState {'),
            ('                self.active.fetch_sub(1, Ordering::AcqRel)\n            }','                self.active.fetch_sub(1, Ordering::AcqRel);\n            };'),
            ('            self.active.fetch_sub(1, Ordering::AcqRel)\n        }','            self.active.fetch_sub(1, Ordering::AcqRel);\n        };'),
            ('                    state.active.fetch_sub(1, Ordering::AcqRel)\n                }','                    state.active.fetch_sub(1, Ordering::AcqRel);\n                };'),
            ('    enforce_target_policy(&cfg, &bind_hint).or_else(|_| Ok(()))?;','    let _ = enforce_target_policy(&cfg, &bind_hint);'),
            ('            tracing::debug!(%peer,error=%e,"pooled proxy connection closed")\n            }\n        })','            tracing::debug!(%peer,error=%e,"pooled proxy connection closed")\n            }\n        });'),
          ])
          replace('src/nonmux.rs',[
            ('        let mut ka = socket2::TcpKeepalive::new();\n        ka.with_time(Duration::from_secs(30));\n        let _ = sock.set_tcp_keepalive(&ka);','        let ka = socket2::TcpKeepalive::new().with_time(Duration::from_secs(30));\n        let _ = sock.set_tcp_keepalive(&ka);'),
            ('            if let Err(error) = handle_client_connection(stream, cfg2).await {\n                tracing::debug!(%peer,%error,"non-MUX client connection closed")\n            }\n        })','            if let Err(error) = handle_client_connection(stream, cfg2).await {\n                tracing::debug!(%peer,%error,"non-MUX client connection closed")\n            }\n        });'),
            ('            if let Err(error) = handle_server(stream, cfg2).await {\n                tracing::debug!(%peer,%error,"non-MUX transport closed")\n            }\n        })','            if let Err(error) = handle_server(stream, cfg2).await {\n                tracing::debug!(%peer,%error,"non-MUX transport closed")\n            }\n        });'),
          ])
          replace('src/runtime.rs',[
            ('        return ip.is_loopback() || ip.is_private() || ip.is_link_local() || ip.is_unspecified();','        return match ip {\n            IpAddr::V4(v4) => v4.is_loopback() || v4.is_private() || v4.is_link_local() || v4.is_unspecified(),\n            IpAddr::V6(v6) => v6.is_loopback() || v6.is_unspecified() || v6.is_unique_local() || v6.is_unicast_link_local(),\n        };'),
            ('        let mut ka = socket2::TcpKeepalive::new();\n        ka.with_time(Duration::from_secs(30));\n        let _ = sock.set_tcp_keepalive(&ka);','        let ka = socket2::TcpKeepalive::new().with_time(Duration::from_secs(30));\n        let _ = sock.set_tcp_keepalive(&ka);'),
            ('        let addr = resolve_socket(&target.host, target.port).await?;','        let addr = resolve_socket(&target.host, target.port).await.map_err(|e| std::io::Error::new(std::io::ErrorKind::Other, e.to_string()))?;'),
          ])
          replace('src/quic.rs',[
            ('    cfg.initial_stream_receive_window(VarInt::from_u64(2 * 1024 * 1024));\n    cfg.max_stream_receive_window(VarInt::from_u64(8 * 1024 * 1024));\n    cfg.initial_connection_receive_window(VarInt::from_u64(4 * 1024 * 1024));\n    cfg.max_connection_receive_window(VarInt::from_u64(16 * 1024 * 1024));','    cfg.stream_receive_window(VarInt::from_u64(8 * 1024 * 1024));\n    cfg.receive_window(VarInt::from_u64(16 * 1024 * 1024));'),
            ('cert.signing_key.serialize_der()','cert.key_pair.serialize_der()'),
            ('        })\n    }','        });\n    }'),
            ('                                })\n                            }','                                });\n                            }'),
            ('                        })\n                    }','                        });\n                    }'),
          ])
          replace('src/wss_client.rs',[
            ('#[derive(Debug)]\nstruct WssSessionState {','struct WssSessionState {'),
            ('#[derive(Debug)]\nstruct WssSessionPool {','struct WssSessionPool {'),
            ('            streams.insert(id, tx)\n','            streams.insert(id, tx);\n'),
            ('                session.active.fetch_sub(1, Ordering::AcqRel)\n            }','                session.active.fetch_sub(1, Ordering::AcqRel);\n            };'),
            ('            tracing::debug!(%peer,error=%e,"WSS non-MUX connection closed")\n            }\n        })','            tracing::debug!(%peer,error=%e,"WSS non-MUX connection closed")\n            }\n        });'),
            ('            tracing::debug!(%peer,error=%e,"WSS proxy connection closed")\n            }\n        })','            tracing::debug!(%peer,error=%e,"WSS proxy connection closed")\n            }\n        });'),
          ])
          replace('src/main.rs',[
            ('value_parser = clap::value_parser!(usize).range(1..=64)','value_parser = clap::value_parser!(usize)'),
            ('value_parser = clap::value_parser!(usize).range(1..=1_000_000)','value_parser = clap::value_parser!(usize)'),
            ('    let args = Args::parse_from(&raw_args);\n    let filter =','    let args = Args::parse_from(&raw_args);\n    if !(1..=64).contains(&args.mux_sessions) {\n        return Err(anyhow!("mux-sessions must be between 1 and 64"));\n    }\n    if let Some(v) = args.max_conn {\n        if !(1..=1_000_000).contains(&v) {\n            return Err(anyhow!("max-conn must be between 1 and 1000000"));\n        }\n    }\n    let filter ='),
          ])
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check compile
        run: cargo check --all-targets --all-features
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/source-repair-once.yml
          git add -A
          git commit -m "fix: compiler sweep" || exit 0
          git push origin HEAD:main
