name: update PR19 handoff

on:
  push:
    branches:
      - astra/go-style-mux-session-manager

jobs:
  update-handoff:
    if: github.event.head_commit.message != 'chore: record PR19 handoff'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Append handoff entry
        shell: bash
        run: |
          cat >> AI_HANDOFF.md <<'EOF'

## 2026-09-15 — Astra fix: Go-style native MUX Session Manager lifecycle

### Bug
- Plain-WS pooled client startup synchronously prewarmed the full configured physical MUX session pool before binding the local proxy listener.
- With a high configured session count, this coupled service readiness to upstream WS/MUX establishment and could make the local proxy appear unavailable during startup.

### Root cause
- `src/mux_pool.rs::MuxSessionPool::prewarm()` performed full sequential upstream physical-session creation before `run_client()` bound the local listener.
- The WSS analogue had already demonstrated the same readiness failure pattern; mature Go-style network services normally separate listener readiness from background connection establishment.

### Astra review
- Concurrency: physical-session creation remains serialized by a dedicated async mutex, while replenishment is moved to a background maintainer.
- Lifecycle: closed sessions are pruned during maintenance/acquisition; lazy acquisition remains available during startup races and transient failures.
- Protocol: MUX wire format, 4-session default, configurable 1..64 sessions, 256 logical streams/session, and target-policy enforcement are preserved.
- Resource ownership: listener binding no longer depends on the success or latency of upstream prewarm.
- Performance: session occupancy is snapshotted before selecting the least-loaded session; the MUX decode benchmark remains green.
- Regression risk: the change is limited to session-pool lifecycle/scheduling; Stream Dispatcher, explicit lifecycle cancellation, TCP+UDP matrix, GoWay interoperability, and device gates remain separate work.

### Change
- `src/mux_pool.rs`: replaced synchronous full prewarm with background self-healing replenishment, serialized physical-session creation, closed-session pruning, and snapshot-based least-loaded selection.
- `src/mux_pool.rs`: retained lazy acquire for startup/failure races.
- `src/mux_pool.rs` / `src/bin/e2e_bench.rs`: preserved the configured physical-session count used by stress diagnostics.
- Branch: `astra/go-style-mux-session-manager`.

### Commit
- `148a1df2e03ef6dca28b0c6489d5a066432335cb`
- PR #19: `refactor: align plain-WS MUX session manager with Go-style lifecycle`

### Validation
- GitHub Actions Run #421: `34941759404`, merge ref `82383844504159c3ee1c46e4e1b877725674968f`.
- Rust fmt/check/release: passed.
- Unit tests: 39/39 passed.
- WS/WSS/QUIC standalone E2E: passed.
- WS staged 1/100/500/1000: 1000/1000 passed.
- WSS staged 1/100/500/1000: 1000/1000 passed.
- QUIC staged 1/100/500/1000: 1000/1000 passed.
- Repeated setup-inclusive and steady-state benchmarks: passed; MUX decode benchmark remained green with `owned_vs_copy_speedup=578.90x`.
- Windows x64 / Debian 12 x64 / ARMv7 builds: passed.
- GoWay comparison: skipped because `WAY_READ_TOKEN` is absent; this is not interoperability evidence.

### Status
**Fixed and validated for the tested native paths.** PR #19 is ready to merge.

### Remaining risk
- Native 1000-stream success is currently evidenced by this full CI run but is not yet a repeated 10x1000 sustained test.
- Explicit stream lifecycle ownership/cancellation, deliberate backpressure tests, physical-session failure recovery, TCP+UDP interoperability, OpenWrt/real-device smoke, and actual cloud GoWay v1.8.4 bidirectional interoperability remain open.
- Existing compiler warnings (including unreachable expressions/dead code) are cleanup items, not evidence of this session-manager defect.

### Next action
- Merge PR #19, then begin the next native phase: explicit Stream Manager lifecycle/cancellation and physical-session recovery, with GoWay v1.8.4 reserved as a separate late compatibility gate.
EOF
